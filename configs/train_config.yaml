# ============================================================================
# Train config for the multimode (mask) truncation + §2 gap-zeroing run.
# Based on train_phys30_mask_v1.yaml (the channelizedmlp_mask_v2 run). Key knobs
# for the new code live in the `truncation:` block at the bottom:
#   truncation.mode: mask                    -> HPD level set + rejection sampling
#   truncation.zero_outside_prev_mask: hard  -> §2: zero the posterior outside the
#                                               region the net was trained on
# Pair with configs/datagen_phys30_chieff_maskzero.yaml.
# ============================================================================
batch_size: 125
epochs: 1000
precision: float32
transform_fd: log
noise_factor: 1.0
delete_prev_round_h5: true
n_train_noise_realisations: 2
classifier_hlayersizes:
- 256
- 256
- 128
- 64
keep_ckpt: true
marginals:
  f:
  - - 0
  - - 1
  - - 2
  - - 3
  - - 4
  - - 10
  - - 7
    - 8
  - - 9
  - - 5
  - - 6
marginal_schedule: []
periodic_bc_params:
- 5
- 7
device: cuda
architecture:
  gradnorm:
    enabled: false
    alpha: 1
    learning_rate: 0.0005
    common_params: linear_f
  data_summary:
    type: ChannelizedMLP
    ChannelizedMLP:
      device: cuda
      representation: real_imag
      n_channels: 2
      n_freqs: 4096
      hidden_dim_per_channel: 256
      out_dim_per_channel: 64
      whiten: true
      amplitude_normalise: true
      subtract_mean_whitened: true
    BrutalCompression:
      Nfreqs: 1000
      lowdim: 16
      in_channels: 4
    PeregrineModel:
      n_channels: 2
      n_timesteps: 6048
      n_freqs: 4096
    ROM:
      load: false
      max_basis_elements: 50
      filename: /u/g/gpuleo/pembhb/rom_td_fd.pt
      device: cuda
      batch_train: 1000
      patience: 25
      freq_split_idx: 2048
      high_freq_only: true
    Autoencoder:
      load: false
      finetune_previous: true
      filename: ''
      device: cuda
      architecture: conv
      representation: real_imag
      n_channels: 2
      n_freqs: 4096
      bottleneck_dim: 128
      hidden_channels:
      - 32
      - 64
      - 128
      - 256
      - 256
      kernel_size: 3
      stride: 2
      dropout: 0.0
      residual: false
      decoder_post_fc_bn: false
      subtract_mean_whitened: true
      compressor_window: null
      ae_output_target: compressed
      whiten: true
      amplitude_normalise: true
      lr: 0.001
      weight_decay: 1.0e-05
      epochs: 500
      scheduler_patience: 10
      scheduler_factor: 0.3
      early_stop_patience: 20
      log_name: autoencoder
    MarginalEncoder:
      load: false
      finetune_previous: true
      filename: ''
      device: cuda
      representation: real_imag
      n_channels: 2
      n_freqs: 4096
      bottleneck_dim: 200
      hidden_channels:
      - 32
      - 64
      - 128
      - 256
      - 512
      - 512
      - 512
      kernel_size: 5
      stride: 2
      dropout: 0.0
      residual: true
      regressor_hidden_sizes:
      - 128
      - 64
      lr: 0.001
      weight_decay: 0.0001
      epochs: 150
      scheduler_patience: 75
      scheduler_factor: 0.3
      early_stop_patience: 3
      log_name: marginal_encoder
baseline_model:
  use: false
  filename: ''
sequential_training:
  early_stop_criterion: volume_ratio
  learning_rate: 0.0001
  scheduler_patience: 80
  scheduler_factor: 0.3
  early_stop_patience: 100
  early_stop_min_delta: 0.001
  early_stop_threshold: 0.999
joint_training:
  ae_warmup_epochs: 0
  lr_ae: 0.0001
  lr_nre: 0.0001
  ae_weight_decay: 1.0e-05
  freeze_ae_after_warmup: false
  transfer_classifiers_across_rounds: false
  transfer_data_summary_across_rounds: true
  reinit_truncated_classifiers: false
  reinit_plateaued_classifiers: false
  reinit_on_prior_shrink: true
  prior_shrink_reinit:
    shrink_factor: 100
  checkpoint_every_n_epochs: 10
  ae_scheduler:
    enabled: true
    monitor: val_nre_loss
    mode: min
    factor: 0.5
    patience: 30
    min_lr: 1.0e-05
    start_epoch: 0
  nre_scheduler:
    enabled: true
    monitor: val_nre_loss
    mode: min
    factor: 0.5
    patience: 20
    min_lr: 1.0e-05
  early_stop_criterion: volume_ratio
  accuracy_early_stop:
    patience: 90
    min_delta: 0.001
    threshold: 0.999
  diff_entropy_early_stop:
    warmup_epochs: 50
    patience: 30
    rel_tol: 0.1
    ema_alpha: 0.3
volume_ratio_early_stop:
  warmup_epochs: 10
  patience: 20
  rel_tol: 0.02
  ema_alpha: 0.3
  min_ratio_threshold: 0.5
rom_use_pinned_memory: false
rom_prefetch_batches: 4
fisher_prior:
  enabled: false
  event_idx: 0
  varying_params:
  - logMchirp
  - q
  - chi_eff
  - chi_diff
  - dist
  - lambda
  - beta
  - Deltat
  - psi
  - phi
  - inc
  fixed_params: []
  n_sigma: 5.0
  param_n_sigma: {}
  step_frac: 0.001
pp_ks_early_stop:
  enabled: true
  trigger_on_overconfidence: true
  test_n: 100
  test_batch_size: 100
  ngrid_points: 50
  warmup_epochs: 100
  run_every_n_epochs: 1
  patience: 40
  ema_alpha: 0.3
  d_threshold: 0.2
  t_threshold: 0.05
  t_quantile: 0.05
  print_every: 20
  lambda_tau:
    enabled: true
    fisher_backend: cuda12x
    warmup_epochs: 0   # λ/τ from epoch 0; PP-KS trigger still waits for warmup_epochs
bnre:
  enabled: false
  lambda: 0.0
classifier_dropout: 0.0
chain_convergence:
  enabled: true
  eps_nats: 0.1
  patience: 2
  require_not_threshold: true
streaming:
  enabled: true
  n_buffers: 5
  buffer_size: 7000
  val_size: 1000
  gen_batch_size: 150
  # epoch = 35000 examples = 280 steps @ bs125 = the seq train-set epoch, so all
  # epoch-based callbacks (plot/10, ppks/1, periodic) fire at the same #examples
  # cadence as the seq run. step_cadence stays off.
  samples_per_epoch: 35000
  reuse_threshold: 10
lambda_tau:
  enabled: true

truncation_veto:
  enabled: false       # veto OFF: never gates truncation.
  log_coverage: true   # ...but still compute + print coverage each round.
                       # NB in mask mode these numbers describe the bounding
                       # BOX, not the mask that is actually sampled -> they are
                       # an upper bound on true coverage.
  min_coverage: 0.999
  n_coverage: 1000
  # 1D truncation box: 99.999% CI (eps=1e-5) inflated 1.1x. Read by the
  # PlotPosteriorCallback regardless of `enabled` (veto off here).
  eps_1d: 1.0e-4
  dilation_1d: 1.0

# ---------------------------------------------------------------------------
# Prior truncation scheme.
#   rectangle : legacy widest_boxes / sky main-mode box (default)
#   mask      : HPD level set -> connected components -> rejection sampling,
#               handles multimodality and periodic wrapping.
# NB dilation_factor 1.0 is NOT "no dilation": analyse_posterior_* applies
# max(1, ceil(...)) so every mode still grows by one pixel per side (~1% of
# the window at ngrid=100). 1.00 and 1.01 are therefore identical here.
# ---------------------------------------------------------------------------
truncation:
  mode: mask
  credible_level_1d: 0.9999
  dilation_1d: 1.00
  credible_level_2d: 0.999
  dilation_2d: 1.1
  ngrid_1d: 100
  ngrid_2d: 200
  # Per-mode refinement. The coarse pass above fixes the topology (how many
  # modes and where); with refine: true each mode is then re-evaluated on its
  # own grid spanning exactly that mode's support, at the resolution below, and
  # ONE threshold is found by pooling every mode's density weighted by its own
  # cell volume. A mode spanning 3 coarse pixels gets ngrid_*_refined of its
  # own; a mode the refinement finds empty is dropped.
  # Cost: one extra forward pass per mode per round (seconds on the GPU).
  refine: false
  ngrid_1d_refined: 128
  ngrid_2d_refined: 64
  # §2 — evaluate the network only on the region it was trained on. Before each
  # round's HPD analysis the posterior is re-weighted by the PREVIOUS round's
  # accepted set (nearest-pixel resampled onto this round's grid), because NRE's
  # ratio p(θ|x)/p(θ) is undefined where the proposal put no mass — the network's
  # output there is unconstrained extrapolation (this is what handed the cos-ι
  # edge-on band back in round 2 of the v2 run).
  #   hard       : zero it. This keeps the HPD level set inside the previous
  #                region, but analyse_posterior_* then DILATES each mode, which
  #                can grow it back past the previous boundary — so hard alone is
  #                NOT strictly monotone (see enforce_monotonic_regions below).
  #   hysteresis : multiply (not zero) the outside by hysteresis_weight, so
  #                re-opening an excluded region needs a higher bar than keeping
  #                it open. Recoverable, at the cost of a slower monotonicity.
  #   off        : pre-§2 behaviour (the posterior spans the full envelope grid).
  zero_outside_prev_mask: hard
  hysteresis_weight: 0.1   # only used when zero_outside_prev_mask: hysteresis
  # §2 monotonicity: after the HPD analysis (threshold + dilation), intersect
  # this round's accepted set with the previous one, A_N := A_N ∩ A_{N-1}, so the
  # post-zeroing dilation cannot re-open the previous boundary. Makes the accepted
  # region strictly non-increasing (the red "suppressed" shading then only grows).
  # Only meaningful with zero_outside_prev_mask: hard; a no-op under hysteresis/off.
  # ⚠ EXCLUSIONS BECOME PERMANENT: an over-aggressive early exclusion can no longer
  # self-correct — truth_violations and the coverage veto are then the ONLY safety
  # nets against discarding the truth.
  enforce_monotonic_regions: true