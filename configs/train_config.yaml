# =========================================================================
# SHARED settings (used by both scripts/tmnre.py and scripts/tmnre_joint.py)
# =========================================================================
batch_size: 250
epochs: 570  # ae_warmup_epochs (270) + NRE budget (300, reference best ckpt epoch=300-step=42140)
precision: "float32"  # "float32" (default) or "float64"
#transform_td: "normalise_max" # options: "none", "logwhiten", "log", "whiten"
transform_fd: "log" # options: "none", "logwhiten", "log", "whiten", "normalise_max"
noise_factor: 1.0
classifier_hlayersizes: [64, 32, 16, 8]
keep_ckpt: True
marginals:
  #  f: [[0]]
  f: [[0,],[1,], [7,8], [10]]
# -------------------------------------------------------------------------
# Marginal schedule (optional)
# Train on different marginal sets depending on the round index.
# Each entry has "from_round" (inclusive) and the "marginals" dict to use.
# Entries are evaluated in order; the LAST matching entry wins.
# If omitted or empty, "marginals" above is used for all rounds.
# -------------------------------------------------------------------------
marginal_schedule: []  # disabled — use the `marginals` block above for all rounds

periodic_bc_params: [ 7, ]
device: "cuda"


architecture:
  gradnorm:
    enabled: False
    alpha: 1
    learning_rate: 0.0005
    common_params: "linear_f"


  data_summary:

    type: "Autoencoder"  # Options: "ROM", "Autoencoder", "MarginalEncoder", "MarginalAutoencoder"
    BrutalCompression:
      Nfreqs: 1000
      lowdim: 16
      in_channels: 4

    PeregrineModel:
      n_channels: 2 # number of channels used (AE--> 2, AET-->3)
      n_timesteps: 6048
      n_freqs: 4096
      # Nfreqs: 100
      # lowdim: 16
      # in_channels: 6
      # cnn_channels: [32, 64]
    ROM:
      load: False
      max_basis_elements: 50
      filename: "/u/g/gpuleo/pembhb/rom_td_fd.pt"
      device: "cuda"
      batch_train: 1000
      patience: 25
      freq_split_idx: 2048
      high_freq_only: True
    Autoencoder:
      load: False
      finetune_previous: True
      filename: ""
      device: "cuda"
      # --- Reference (20260420autoenc_test5d) architecture ---
      architecture: "conv"         # "conv" or "unet"
      representation: "real_imag"  # "amp_phase" or "real_imag"
      n_channels: 2                # TDI channels (AE→2, AET→3)
      n_freqs: 4096
      bottleneck_dim: 128
      hidden_channels: [32, 64, 128, 256, 256]
      kernel_size: 3
      stride: 2
      dropout: 0.0
      residual: False              # matches reference (no residual shortcuts)
      decoder_post_fc_bn: False    # matches reference (cb948642): no BatchNorm between FC and conv-transpose stack
      high_freq_only: False         # KEEP CURRENT (reference was True with freq_split_idx=2048)
      freq_split_idx: 2048
      # --- Reference training hyper-parameters ---
      lr: 0.001
      weight_decay: 1.0e-5
      epochs: 500                  # inert in joint mode (warmup uses ae_warmup_epochs)
      scheduler_patience: 10
      scheduler_factor: 0.3
      early_stop_patience: 20
      log_name: "autoencoder"
  
    # -----------------------------------------------------------------------
    # Per-marginal encoder with parameter regression (replaces shared AE).
    # Each marginal gets its own ConvEncoder trained to regress its param(s).
    # Activate by setting  data_summary.type: "MarginalEncoder"
    # -----------------------------------------------------------------------
    MarginalEncoder:
      load: False
      finetune_previous: True
      filename: ""          # path to MarginalEncoderTrainer checkpoint (load: True only)
      device: "cuda"
      # --- ConvEncoder architecture (same hyper-params as Autoencoder.conv) ---
      representation: "real_imag"   # "real_imag" or "amp_phase"
      n_channels: 2                 # TDI channels (AE→2, AET→3)
      n_freqs: 4096
      bottleneck_dim: 200
      hidden_channels: [32, 64, 128, 256, 512, 512, 512]
      kernel_size: 5
      stride: 2
      dropout: 0.0
      residual: True          # residual shortcut connections in the ConvEncoder
      # --- Regression head (MLP after bottleneck) ---
      # Predicts the parameter(s) associated with each marginal.
      # Loss: MSE on normalised parameter values.
      # Deeper heads help for 2-D marginals; keep small to not dominate capacity.
      regressor_hidden_sizes: [128, 64]
      # --- Training ---
      lr: 0.001
      weight_decay: 0.0001
      epochs: 150
      scheduler_patience: 75
      scheduler_factor: 0.3
      early_stop_patience: 3
      log_name: "marginal_encoder"

baseline_model:
  use: False
  #filename: "/data/gpuleo/mbhb/logs/20251205_100028_round_0/version_0/checkpoints/epoch=474-step=133000.ckpt"
  filename: ""

# =========================================================================
# SEQUENTIAL training  (scripts/tmnre.py only)
# These keys are merged into the top level of the config at script startup,
# so InferenceNetwork reads them at the flat keys it expects (learning_rate,
# scheduler_patience, ...).  Old configs with these keys at the top level
# continue to work unchanged.
# =========================================================================
sequential_training:
  early_stop_criterion: "accuracy"  # "accuracy" | "volume_ratio"
  learning_rate: 0.0001
  scheduler_patience: 80
  scheduler_factor: 0.3
  # Accuracy-based EarlyStopping on the NRE validation accuracy.
  early_stop_patience: 100
  early_stop_min_delta: 0.001
  early_stop_threshold: 0.999


# =========================================================================
# JOINT AE + NRE training  (scripts/tmnre_joint.py only)
# =========================================================================
joint_training:
  ae_warmup_epochs: 200         # matches reference round-1 AE training duration (best ckpt at 256, ran to 270)
  lr_ae: 0.001                  # matches reference AE lr
  lr_nre: 0.0001                # matches reference NRE learning_rate
  ae_weight_decay: 1.0e-5       # matches reference AE weight_decay
  freeze_ae_after_warmup: false # mimics tmnre.py's frozen-encoder NRE training
  transfer_enabled: true        # retain the previously trained classifier for the next round
  # -----------------------------------------------------------------------
  # Per-parameter-group LR schedulers.
  # Each block is wired to its own optimizer param group (encoder vs. NRE)
  # via SingleGroupReduceLROnPlateau, so reducing one does not touch the
  # other.  Set enabled: false to disable the scheduler for that group.
  #
  # `monitor`:  any scalar logged by training_step / validation_step,
  #             e.g. "val_ae_loss", "val_nre_loss", "val_loss".
  # `start_epoch`: ignore epochs before this index (useful for the NRE
  #             scheduler so it does not see val_nre_loss = 0 during the
  #             AE warmup).  If omitted, the NRE scheduler auto-defaults to
  #             ae_warmup_epochs.
  # Deprecated flat keys ae_scheduler_patience / ae_scheduler_factor are
  # still read as fallbacks when these dicts are absent.
  # -----------------------------------------------------------------------
  ae_scheduler:
    enabled: true
    monitor: "val_ae_loss"
    mode: "min"
    factor: 0.3            # matches autoencoder.py @ cb948642 (scheduler_factor=0.3)
    patience: 10           # matches autoencoder.py @ cb948642 (scheduler_patience=10)
    min_lr: 1.0e-7
    start_epoch: 0

  nre_scheduler:
    enabled: false         # reference model.py @ cb948642 returns optimizer with NO scheduler
    monitor: "val_nre_loss"
    mode: "min"
    factor: 0.3
    patience: 10
    min_lr: 1.0e-7
    # start_epoch: <defaults to ae_warmup_epochs if omitted>

  # -----------------------------------------------------------------------
  # Joint-only early stopping criterion: "volume_ratio" | "differential_entropy" | "accuracy"
  # The reference run (sequential tmnre.py) used accuracy-based EarlyStopping;
  # "accuracy" is implemented in tmnre_joint.py via WarmupEarlyStopping that
  # ignores epochs before ae_warmup_epochs (where val_accuracy is constant 0.5).
  # -----------------------------------------------------------------------
  early_stop_criterion: "volume_ratio"

  # accuracy-based early-stopping parameters (used when
  # early_stop_criterion == "accuracy"); values from reference sequential_training.
  accuracy_early_stop:
    patience: 90
    min_delta: 0.001
    threshold: 0.999

  # differential-entropy stop parameters (used when
  # early_stop_criterion == "differential_entropy")
  diff_entropy_early_stop:
    warmup_epochs: 50
    patience: 10
    rel_tol: 0.02
    ema_alpha: 0.3


# =========================================================================
# Volume-ratio early stopping  (shared — used by both tmnre.py and
# tmnre_joint.py when their respective configs select it)
# =========================================================================
volume_ratio_early_stop:
  warmup_epochs: 80       # ignore first N epochs (posterior is noisy)
  patience: 20            # consecutive stalled evaluations before stopping
  rel_tol: 0.02           # relative EMA change threshold for "stalled"
  ema_alpha: 0.3          # EMA smoothing factor (higher = more reactive)
  min_ratio_threshold: 0.5  # stop immediately if any marginal ratio drops here

rom_use_pinned_memory: false  # Only set true for single-session usage
rom_prefetch_batches: 4       # Increase to reduce Python overhead

# -------------------------------------------------------------------------
# Fisher-matrix prior initialisation for round 1
# When enabled: true the prior for the first round of data generation is
# computed automatically from the Fisher Information Matrix evaluated at the
# true parameters of the target event.  Set enabled: false to fall back to
# the bounds in datagen_config.yaml.
# -------------------------------------------------------------------------
fisher_prior:
  enabled: false
  event_idx: 0           # which event in the HDF5 file to use as expansion point
  varying_params:        # FIM-based bounds are computed for these parameters
    - "logMchirp"
    - "q"
    - "lambda"
    - "beta"
    - "Deltat"
  fixed_params:          # these parameters are pinned to the value read from the observation file
    - "chi1"
    - "chi2"
    - "dist"
    - "phi"
    - "inc"
    - "psi"
  n_sigma: 10.0           # prior half-width in units of FIM sigma
  delta_frac: 1.0e-4     # fractional step size for numerical derivatives