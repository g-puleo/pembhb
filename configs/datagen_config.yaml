waveform_params:
  channels: "AE"
  modes:  [[2,2], [2,1], [3,3], [3,2], [4,4], [4,3]]
  noise: "sangria"
  duration: 1 # weeks
  dt: 5 # seconds
  t_max: 5 # days
  # FD-only settings (used when domain="fd"; ignored for "fd_td")
  domain: "fd"          # "fd" for FD-only simulator, "fd_td" for FD+TD (default)
  n_freq_bins: 4096        # number of frequency bins (FD-only)
  freq_spacing: "log"   # "linear" or "log" (FD-only)

prior:
  "logMchirp": [5.249960881397025, 5.250039118602975]
  "q":         [2.996074595121879, 3.003925404878121]
  "chi1":      [0.0, 0.0]
  "chi2":      [0.0, 0.0]
  "dist":      [10.0, 10.0]                                      # Gpc (sampled uniformly in dist^3)
  "phi":       [0.0, 0.0]                                        # phase at coalescence
  "inc":       [0.5, 0.5]                                        # cos inclination
  "lambda":    [3.1124873962687998, 3.16751281353955]            # ecliptic longitude
  "beta":      [0.18623696704815745, 0.21376303891230702]        # sin ecliptic latitude
  "psi":       [1.0,1.0]                                        # polarization angle in [0, pi]
  "Deltat":    [-2.5000186218908196, -2.4999813781091804]        # t_merger from end of observation (days)

backend: "cuda12x"


