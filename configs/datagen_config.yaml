waveform_params:
  channels: "AE"
  modes:  [[2,2], [2,1], [3,3], [3,2], [4,4], [4,3]]
  noise: "sangria"
  duration: 1 # weeks
  dt: 100 # seconds
  # FD-only settings (used when domain="fd"; ignored for "fd_td")
  domain: "fd"          # "fd" for FD-only simulator, "fd_td" for FD+TD (default)
  n_freq_bins: 4096        # number of frequency bins (FD-only; used for freq_spacing="log" only)
  freq_spacing: "linear"   # "linear" or "log" (FD-only)
  # Lower edge of the FD grid (Hz). Effective fmin is max(this, 1/T_obs).
  # Defaults to FMIN_FLOOR (1e-4) when omitted. Use 1.0e-5 to reproduce
  # the pre-60db969 baseline grid.
  fmin: 1.0e-4
  # Upper edge of the FD grid (Hz). When freq_spacing="linear", the grid is
  # np.arange(fmin, fmax, downsamplefactor / T_obs).

  fmax: 2.0e-2
  downsamplefactor: 1    # match obs_fmin1e-4_fmax2e-2_ds1 grid (12036 bins, 1-week T_obs)
  #psd_fmin_mask: 5.0e-5 # restore the low freq cutoff. 
  
prior:
  # Pinned to the injection truth for observation generation (simulate_data.py).
  # Fisher overrides these for the varying params at TMNRE round 1 anyway.
  "logMchirp": [5.25, 5.25]
  "q":         [3.00, 3.00]
  "chi_eff":   [0.0, 0.0]        # effective aligned spin (slot 2; basis chieff_chidiff)
  "chi_diff":  [0.0, 0.0]        # differential spin (chi1-chi2)/2 (slot 3)
  "dist":      [10.0, 10.0]                                      # Gpc (sampled uniformly in dist^3)
  "phi":       [3.1415, 3.1415]                                  # phase at coalescence (phimid, matches obs)
  "inc":       [0.5, 0.5]                                        # cos inclination
  "lambda":    [3.14159265358979, 3.14159265358979]            # ecliptic longitude
  "beta":      [0.2, 0.2]        # sin ecliptic latitude
  "psi":       [1.0,1.0]                                        # polarization angle in [0, pi]
  "Deltat":    [-2.50, -2.50]        # t_merger from end of observation (days)

  # "logMchirp": [5.25, 5.25]
  # "q":         [3.00, 3.00]
  # "chi1":      [0.0, 0.0]
  # "chi2":      [0.0, 0.0]
  # "dist":      [10.0, 10.0]                                      # Gpc (sampled uniformly in dist^3)
  # "phi":       [0.0, 0.0]                                        # phase at coalescence
  # "inc":       [0.5, 0.5]                                        # cos inclination
  # "lambda":    [3.14159265358979, 3.14159265358979]            # ecliptic longitude
  # "beta":      [0.2, 0.2]        # sin ecliptic latitude
  # "psi":       [1.0,1.0]                                        # polarization angle in [0, pi]
  # "Deltat":    [-2.50, -2.50]        # t_merger from end of observation (days)

# Spin sampling basis (slots 2,3 of the prior).
#   "chi1chi2"        (legacy): prior keys are "chi1","chi2".
#   "chieff_chidiff"  : prior keys are "chi_eff","chi_diff"; the sampler inverts
#                       to (chi1,chi2) for bbhx and rejects draws with |chi|>1.
# The two spin bounds in the prior block above must be keyed to match this.
spin_param_basis: "chieff_chidiff"

backend: "cuda12x"


