# Data-generation config: frequency grid, noise model, prior, injection.
# The observation and the training simulations MUST share `waveform_params`
# (tmnre_joint.py aborts on any mismatch against the obs sidecar YAML).

waveform_params:
  channels: "AE"                                   # TDI channels (subset of "AET")
  modes: [[2,2], [2,1], [3,3], [3,2], [4,4], [4,3]] # bbhx PhenomHM harmonics
  noise: "sangria"                                 # lisatools sensitivity model
  duration: 1                                      # observation length [weeks]; sets df = 1/T_obs
  freq_spacing: "linear"                           # "linear" or "log"
  n_freq_bins: 4096                                # only used when freq_spacing = "log"
  fmin: 1.0e-4                                     # [Hz]; effective fmin = max(fmin, 1/T_obs)
  fmax: 2.0e-2                                     # [Hz]; required, must be <= 0.1 (PSD-veto reference grid)
  downsamplefactor: 1                              # must be 1 (grid step = 1/T_obs); other values raise

# Training prior (uniform box). Round 1 of tmnre_joint.py may replace the
# varying parameters with a Fisher-matrix prior (see train_config.yaml).
prior:
  logMchirp: [5.9, 6.1]                 # log10 chirp mass [Msun]
  q:         [1, 5]                     # mass ratio m1/m2 >= 1
  chi_eff:   [-0.97, 0.97]              # effective aligned spin
  chi_diff:  [-0.97, 0.97]              # (chi1 - chi2) / 2
  dist:      [1.0, 100.0]               # luminosity distance [Gpc], uniform in volume
  phi:       [0, 6.283185307179586]     # phase
  inc:       [-1.0, 1.0]                # cos(inclination)
  lambda:    [0, 6.283185307179586]     # ecliptic longitude
  beta:      [-1.0, 1.0]                # sin(ecliptic latitude)
  psi:       [0, 3.14159265358979]      # polarisation angle
  Deltat:    [-2.55, -2.45]             # merger time relative to end of observation [days]

# Ground truth for the observation; used by `simulate_data.py --injection`.
injection:
  logMchirp: 6.0
  q:         3.0
  chi_eff:   0.0
  chi_diff:  0.0
  dist:      15.0
  phi:       3.1415
  inc:       0.5
  lambda:    3.14159265358979
  beta:      0.2
  psi:       1.0
  Deltat:    -2.50

# Spin basis for prior slots 2,3:
#   "chieff_chidiff": keys chi_eff, chi_diff (converted to chi1, chi2 for bbhx; |chi|>1 rejected)
#   "chi1chi2":       keys chi1, chi2
spin_param_basis: "chieff_chidiff"

backend: "cuda12x"   # bbhx/lisatools backend: "cuda12x", "cuda11x" or "cpu"
