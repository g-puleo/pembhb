waveform_params:
  channels: "AE"
  modes:  [[2,2], [2,1], [3,3], [3,2], [4,4], [4,3]]
  noise: "sangria"
  duration: 1 # weeks
  dt: 100 # seconds
  t_max: 5 # days
  # FD-only settings (used when domain="fd"; ignored for "fd_td")
  domain: "fd"          # "fd" for FD-only simulator, "fd_td" for FD+TD (default)
  n_freq_bins: 4096        # number of frequency bins (FD-only)
  freq_spacing: "linear"   # "linear" or "log" (FD-only)

prior:
  # Copied from the reference run 20260420autoenc_test5d
  # /data/gpuleo/mbhb/20260420autoenc_test5d/simulation_round_1.yaml
  # (Fisher-widened 15-sigma box around the fiducial event; using these
  # verbatim so fisher_prior can stay disabled in train_config.yaml.)
  "logMchirp": [5.2, 5.3]
  "q":         [1, 5]
  "chi1":      [0.0, 0.0]
  "chi2":      [0.0, 0.0]
  "dist":      [10.0, 10.0]                                      # Gpc (sampled uniformly in dist^3)
  "phi":       [0.0, 0.0]                                        # phase at coalescence
  "inc":       [0.5, 0.5]                                        # cos inclination
  "lambda":    [0, 6.283185307179586]            # ecliptic longitude
  "beta":      [-1.0, 1.0]        # sin ecliptic latitude
  "psi":       [1.0,1.0]                                        # polarization angle in [0, pi]
  "Deltat":    [-2.55, -2.45]        # t_merger from end of observation (days)

backend: "cuda12x"


