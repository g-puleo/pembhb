# ============================================================================
# Training config for scripts/tmnre_joint.py.
#   architecture.data_summary : compressor in front of the classifier heads
#   marginals                 : which 1D / 2D posterior marginals to learn
#   streaming                 : simulate during training (gpu ring or disk ring)
#   truncation                : how the prior is narrowed between rounds
#                               (mode: mask -> HPD level set + rejection sampling)
# ============================================================================
batch_size: 125
epochs: 1000
precision: float32
transform_fd: log
noise_factor: 1.0
delete_prev_round_h5: true
n_train_noise_realisations: 2
classifier_hlayersizes:
- 256
- 256
- 128
- 64
keep_ckpt: true
# One classifier head per marginal, by parameter name (see datagen_config.yaml
# `prior`). A parameter may appear in only one marginal.
marginals:
  f:
  - [logMchirp]
  - [q]
  - [chi_eff]
  - [chi_diff]
  - [dist]
  - [Deltat]
  - [lambda, sinbeta]
  - [psi]
  - [phi]
  - [cosinc]
marginal_schedule: []
periodic_bc_params:
- 5
- 7
device: cuda
architecture:
  gradnorm:
    enabled: false
    alpha: 1
    learning_rate: 0.0005
    common_params: linear_f
  data_summary:
    type: ChannelizedMLP
    ChannelizedMLP:
      device: cuda
      representation: real_imag
      n_channels: 2
      n_freqs: 4096
      whiten: true
      amplitude_normalise: true
      subtract_mean_whitened: true
      # encoder: "mlp"  -> one MLP per real channel, outputs concatenated
      #          "conv" -> one 1D CNN over all real channels (ConvCompressor)
      encoder: conv
      hidden_dim_per_channel: 256   # mlp only
      out_dim_per_channel: 64       # mlp only; summary = 2 * n_channels * this
      conv:                         # conv only
        bottleneck_dim: 256         # summary size
        hidden_channels: [16, 32, 32, 64, 64, 64, 64, 64, 64]   # one stride-2 layer each
        kernel_size: 5
        residual: true
    BrutalCompression:
      Nfreqs: 1000
      lowdim: 16
      in_channels: 4
    PeregrineModel:
      n_channels: 2
      n_timesteps: 6048
      n_freqs: 4096
    ROM:
      load: false
      max_basis_elements: 50
      filename: rom_td_fd.pt   # relative to the working directory
      device: cuda
      batch_train: 1000
      patience: 25
      freq_split_idx: 2048
      high_freq_only: true
    Autoencoder:
      load: false
      finetune_previous: true
      filename: ''
      device: cuda
      architecture: conv
      representation: real_imag
      n_channels: 2
      n_freqs: 4096
      bottleneck_dim: 128
      hidden_channels:
      - 32
      - 64
      - 128
      - 256
      - 256
      kernel_size: 3
      stride: 2
      dropout: 0.0
      residual: false
      decoder_post_fc_bn: false
      subtract_mean_whitened: true
      compressor_window: null
      ae_output_target: compressed
      whiten: true
      amplitude_normalise: true
      lr: 0.001
      weight_decay: 1.0e-05
      epochs: 500
      scheduler_patience: 10
      scheduler_factor: 0.3
      early_stop_patience: 20
      log_name: autoencoder
    MarginalEncoder:
      load: false
      finetune_previous: true
      filename: ''
      device: cuda
      representation: real_imag
      n_channels: 2
      n_freqs: 4096
      bottleneck_dim: 200
      hidden_channels:
      - 32
      - 64
      - 128
      - 256
      - 512
      - 512
      - 512
      kernel_size: 5
      stride: 2
      dropout: 0.0
      residual: true
      regressor_hidden_sizes:
      - 128
      - 64
      lr: 0.001
      weight_decay: 0.0001
      epochs: 150
      scheduler_patience: 75
      scheduler_factor: 0.3
      early_stop_patience: 3
      log_name: marginal_encoder
baseline_model:
  use: false
  filename: ''
sequential_training:
  early_stop_criterion: volume_ratio
  learning_rate: 0.0001
  scheduler_patience: 80
  scheduler_factor: 0.3
  early_stop_patience: 100
  early_stop_min_delta: 0.001
  early_stop_threshold: 0.999
joint_training:
  ae_warmup_epochs: 0
  # Fiducial: one fixed LR for encoder and heads, no scheduler (both disabled below).
  lr_ae: 3.0e-4
  lr_nre: 3.0e-4
  ae_weight_decay: 1.0e-05
  freeze_ae_after_warmup: false
  transfer_classifiers_across_rounds: false
  transfer_data_summary_across_rounds: true
  reinit_truncated_classifiers: false
  reinit_plateaued_classifiers: false
  reinit_on_prior_shrink: true
  prior_shrink_reinit:
    shrink_factor: 100
  checkpoint_every_n_epochs: 10
  carry_optimizer_state: true
  ae_scheduler:
    enabled: false
    monitor: val_nre_loss
    mode: min
    factor: 0.5
    patience: 30
    min_lr: 1.0e-05
    start_epoch: 0
  nre_scheduler:
    enabled: false
    monitor: val_nre_loss
    mode: min
    factor: 0.5
    patience: 20
    min_lr: 1.0e-05
  early_stop_criterion: volume_ratio
  accuracy_early_stop:
    patience: 90
    min_delta: 0.001
    threshold: 0.999
  diff_entropy_early_stop:
    warmup_epochs: 50
    patience: 30
    rel_tol: 0.1
    ema_alpha: 0.3
volume_ratio_early_stop:
  warmup_epochs: 10
  patience: 5        # counts posterior-plot fires (every 10 epochs): ~50 epochs of <2% change
  rel_tol: 0.02
  ema_alpha: 0.3
  min_ratio_threshold: 0.8
rom_use_pinned_memory: false
rom_prefetch_batches: 4
fisher_prior:
  enabled: false
  event_idx: 0
  varying_params:
  - logMchirp
  - q
  - chi_eff
  - chi_diff
  - dist
  - lambda
  - sinbeta
  - Deltat
  - psi
  - phi
  - cosinc
  fixed_params: []
  n_sigma: 5.0
  param_n_sigma: {}
  step_frac: 0.001
# Calibration monitor on the first test_n simulations of the round's test pool:
# PP-KS D/T per 1D marginal (TensorBoard pp_ks/*) and the λ/τ statistics
# (lambda_tau_stats_round_<i>.h5). Diagnostic only: it never stops training.
calibration_monitor:
  enabled: true
  test_n: 100
  test_batch_size: 100
  ngrid_points: 50
  warmup_epochs: 100       # EMA of D/T starts after this many cumulative epochs
  run_every_n_epochs: 1
  ema_alpha: 0.3
  d_threshold: 0.2         # reference lines in plot_calibration_history.py
  t_threshold: 0.05
  t_quantile: 0.05         # T = fraction of ranks in the outer 2*t_quantile
  print_every: 20
  lambda_tau:
    enabled: true
    fisher_backend: cuda12x
    chunk_size: 4            # Fisher points per bbhx call; ~0.67 GB/point at 60k bins
    warmup_epochs: 0
bnre:
  enabled: false
  lambda: 0.0
classifier_dropout: 0.0
chain_convergence:
  enabled: true
  eps_nats: 0.1
  patience: 2
  require_not_threshold: true
streaming:
  enabled: true
  # gpu  : ring of VRAM-resident chunks, an epoch cycles rows with idx % M.
  # disk : ring of buffer_{j}.h5 files overwritten in place (~zero VRAM). An
  #        epoch locks k whole files and reads every row exactly once.
  storage: gpu

  # --- ring geometry (disk path asserts both invariants at setup) -----------
  # k = samples_per_epoch / buffer_size   -> files the consumer reads per epoch
  #   (1) samples_per_epoch must be an exact multiple of buffer_size
  #   (2) n_buffers >= k + 1, so the producer always has one file free to
  #       refresh while an epoch is being read
  # Here: k = 35000 / 7000 = 5 files per epoch, 6 on disk, 1 always refreshable.
  n_buffers: 6
  buffer_size: 7000
  # epoch = 35000 examples = 280 steps @ bs125 = the seq train-set epoch, so all
  # epoch-based callbacks (plot/10, ppks/1, periodic) fire at the same #examples
  # cadence as the seq run. step_cadence stays off.
  samples_per_epoch: 35000

  # A file becomes eligible for overwrite only once it has been consumed this
  # many times, so every simulation is trained on 10 epochs before it is
  # replaced. With k=5 of 6 files, the ring turns over roughly every 12 epochs.
  reuse_threshold: 10

  # Producer batch, and the frozen per-round validation pool (generated once).
  gen_batch_size: 150
  val_size: 1000

  # --- disk path only -------------------------------------------------------
  # Where the buffer files live (default: under PEMBHB_DATA_DIR).
  # Footprint is n_buffers * buffer_size waveforms.
  # buffer_dir: /path/to/<run>/stream_buffers
  num_workers: 8
  prefetch_factor: 4
lambda_tau:
  enabled: true

truncation_veto:
  # Rectangle-mode truncation settings (truncation.mode: rectangle), also used
  # by PlotPosteriorCallback for its 1D box overlay: 1-eps equal-tailed
  # interval, then dilated.
  eps_1d: 1.0e-4
  dilation_1d: 1.0

# Round-end proposal-coverage guard (truncation.mode: mask). For n_coverage
# val-pool simulations the next-round proposal is built from each one's own data
# with the same code as the real proposal (HPD masks on the refined windows of
# the current domain, 1D and 2D), and its truth is tested for membership.
# Expected coverage is the credible level (~0.9999 1D, ~0.999 2D); below
# min_coverage for a marginal being truncated, the run stops with a report and
# writes rejected_truncation_round_N.* instead of prior_after_round_N.
coverage_guard:
  min_coverage: 0.98
  n_coverage: 300
  seed: 0

# ---------------------------------------------------------------------------
# Prior truncation scheme.
#   rectangle : legacy widest_boxes / sky main-mode box (default)
#   mask      : HPD level set -> connected components -> rejection sampling,
#               handles multimodality and periodic wrapping.
# NB dilation_factor 1.0 is NOT "no dilation": analyse_posterior_* applies
# max(1, ceil(...)) so every mode still grows by one pixel per side (~1% of
# the window at ngrid=100). 1.00 and 1.01 are therefore identical here.
# ---------------------------------------------------------------------------
truncation:
  mode: mask
  credible_level_1d: 0.9999
  dilation_1d: 1.00
  credible_level_2d: 0.999
  dilation_2d: 1.1
  # Round 1 only: coarse grid over the prior box that finds the first modes.
  ngrid_1d: 100
  ngrid_2d: 200
  # From round 2 on, the posterior lives on the previous round's accepted set
  # (its domain). Each mode of the domain is evaluated on its own grid of this
  # many cells per axis; ONE HPD level, normalised over the whole domain, gives
  # the new accepted set, so it keeps >= credible_level of the posterior
  # (logged as truncation/kept/*). Resolution compounds across rounds: the next
  # round's windows are this round's modes.
  ngrid_1d_refined: 128
  ngrid_2d_refined: 64
  # §2 — evaluate the network only on the region it was trained on. Before each
  # round's HPD analysis the posterior is re-weighted by the PREVIOUS round's
  # accepted set (nearest-pixel resampled onto this round's grid), because NRE's
  # ratio p(θ|x)/p(θ) is undefined where the proposal put no mass — the network's
  # output there is unconstrained extrapolation (this is what handed the cos-ι
  # edge-on band back in round 2 of the v2 run).
  #   hard       : zero it. This keeps the HPD level set inside the previous
  #                region, but analyse_posterior_* then DILATES each mode, which
  #                can grow it back past the previous boundary — so hard alone is
  #                NOT strictly monotone (see enforce_monotonic_regions below).
  #   hysteresis : multiply (not zero) the outside by hysteresis_weight, so
  #                re-opening an excluded region needs a higher bar than keeping
  #                it open. Recoverable, at the cost of a slower monotonicity.
  #   off        : pre-§2 behaviour (the posterior spans the full envelope grid).
  zero_outside_prev_mask: hard
  hysteresis_weight: 0.1   # only used when zero_outside_prev_mask: hysteresis
  # §2 monotonicity: after the HPD analysis (threshold + dilation), intersect
  # this round's accepted set with the previous one, A_N := A_N ∩ A_{N-1}, so the
  # post-zeroing dilation cannot re-open the previous boundary. Makes the accepted
  # region strictly non-increasing (the red "suppressed" shading then only grows).
  # Only meaningful with zero_outside_prev_mask: hard; a no-op under hysteresis/off.
  # ⚠ EXCLUSIONS BECOME PERMANENT: an over-aggressive early exclusion can no longer
  # self-correct — truth_violations and the coverage veto are then the ONLY safety
  # nets against discarding the truth.
  enforce_monotonic_regions: true