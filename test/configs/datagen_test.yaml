# Small CPU-only datagen config for the test suite (independent of configs/).
waveform_params:
  channels: "AE"
  modes: [[2,2], [3,3]]
  noise: "sangria"
  duration: 1
  freq_spacing: "linear"
  n_freq_bins: 4096
  fmin: 1.0e-4
  fmax: 3.0e-3
  downsamplefactor: 1

prior:
  logMchirp: [5.9, 6.1]
  q:         [1, 5]
  chi_eff:   [-0.9, 0.9]
  chi_diff:  [-0.5, 0.5]
  dist:      [10.0, 20.0]
  phi:       [0, 6.283185307179586]
  cosinc:    [-1.0, 1.0]
  lambda:    [0, 6.283185307179586]
  sinbeta:   [-1.0, 1.0]
  psi:       [0, 3.14159265358979]
  Deltat:    [-2.55, -2.45]

injection:
  logMchirp: 6.0
  q:         3.0
  chi_eff:   0.0
  chi_diff:  0.0
  dist:      15.0
  phi:       3.1415
  cosinc:    0.5
  lambda:    3.14159265358979
  sinbeta:   0.2
  psi:       1.0
  Deltat:    -2.50

spin_param_basis: "chieff_chidiff"
backend: "cpu"
