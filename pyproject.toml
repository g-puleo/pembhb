[project]
name = "pembhb"
version = "0.1.0"
description = "TMNRE for MBHB parameter estimation in LISA"
authors = [
    {name = "Gianmarco Puleo",email = "gpuleo@sissa.it"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy (>=2.0)",
    "torch (>=2.6)",
    "lightning (==2.5.2)",
    "tensorboard",
    "h5py (>=3.5)",
    "pyyaml",
    "scipy",
    "tqdm",
    "matplotlib (>=3.10.3,<4.0.0)",
    "bbhx (==1.2.3)",
    "lisaanalysistools (==1.2.8)",
    "pytest (>=8.4.1,<9.0.0)"
]

[project.optional-dependencies]
cuda12x = [
    "bbhx-cuda12x (==1.2.3)",
    "lisaanalysistools-cuda12x (==1.2.8)",
    "cupy-cuda12x",
]
[tool.poetry]
packages = [
    { include = "pembhb", from = "src" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
